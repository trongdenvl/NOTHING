<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi em 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ee5f98;--pink2:#f79bbd;--paper:#fffaf0;--ink:#6b2a45;--script:'Dancing Script','Segoe Script',cursive;--sans:'Quicksand',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--sans);color:var(--ink);user-select:none;touch-action:none}
body{background:#fde3ef;background-image:linear-gradient(rgba(238,95,152,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(238,95,152,.09) 1px,transparent 1px);background-size:28px 28px}
.bg2{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#dcbad0,#c597b4);opacity:0;transition:opacity 1s;pointer-events:none}
body.in-notes .bg2{opacity:1}
.scene{position:fixed;inset:0;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s}
.scene.on{opacity:1;visibility:visible}
.hint{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:#d06a95;transition:opacity .4s}
.in-notes .hint{color:#fff}

/* ---- Màn hình khóa ---- */
.lockcard{width:min(520px,92vw);display:flex;gap:6vw;align-items:center;padding:clamp(14px,4vw,32px);border-radius:22px;background:linear-gradient(160deg,#f77fae,#ec5f98);box-shadow:0 24px 50px rgba(238,95,152,.35);color:#fff}
.lockcard.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.lockphoto{flex:0 0 40%;aspect-ratio:3/4.4;border-radius:14px;background:#fff center/cover;border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.pad{flex:1;text-align:center}
.pad .lh{width:28px;height:28px;margin:0 auto 8px;border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center;font-size:13px}
.pad h2{font-size:15px;margin-bottom:10px}
.dots{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid #fff}
.dots i.f{background:#fff}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;justify-items:center}
.keys button{width:clamp(38px,11vw,52px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);color:#fff;font:700 20px var(--sans);cursor:pointer;transition:background .15s}
.keys button:active{background:rgba(255,255,255,.5)}
.keys .z{grid-column:2}
.msg{min-height:16px;margin-top:8px;font-size:12px;font-weight:700}

/* ---- Phong thư ---- */
.env{position:relative;width:min(310px,78vw);aspect-ratio:3/2;perspective:900px;cursor:pointer;filter:drop-shadow(0 18px 22px rgba(190,60,120,.3));transition:transform .8s}
.env>*{position:absolute}
.eback{inset:0;background:#e84f8c;border-radius:8px}
.eletter{left:7%;right:7%;top:8%;bottom:6%;background:var(--paper);border-radius:4px;display:grid;place-items:center;font:600 26px var(--script);color:var(--ink);transition:transform .9s .35s cubic-bezier(.3,1.3,.5,1);z-index:2}
.efront{inset:0;border-radius:8px;z-index:4;background:linear-gradient(to top right,#ee5f98 50%,#f79bbd 50%)}
.eflap{left:0;right:0;top:0;height:60%;background:#f9a9c6;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:5;transition:transform .55s}
.eseal{left:50%;top:56%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#ff5d9a;color:#fff;border:3px solid #fff;display:grid;place-items:center;z-index:6;font-size:14px;animation:beat 1.6s infinite}
@keyframes beat{50%{transform:scale(1.15)}}
.env.open .eflap{transform:rotateX(180deg);z-index:1;transition:transform .55s,z-index 0s .25s}
.env.open .eletter{transform:translateY(-52%)}
.env.open .eseal{display:none}
.env.gone{transform:scale(.8) translateY(60px);opacity:0}
.heartbg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.heartbg span{position:absolute;bottom:-30px;color:#f58db6;opacity:.6;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}

/* ---- Chồng giấy ---- */
.stack{position:relative;width:min(560px,88vw);aspect-ratio:1.42;transform:rotate(-1.5deg);touch-action:none}
.sheet{position:absolute;inset:0;border-radius:6px;background:var(--paper);box-shadow:0 14px 30px rgba(90,30,70,.28)}
.sheet.s1{transform:translate(8px,7px) rotate(1.4deg);background:#f4ead6}
.sheet.s2{transform:translate(-6px,13px) rotate(-1.2deg);background:#eee1cb}
.note{position:absolute;inset:0;border-radius:6px;background:var(--paper) repeating-linear-gradient(transparent 0 25px,rgba(200,170,150,.35) 25px 26px);box-shadow:0 12px 26px rgba(90,30,70,.28);display:grid;place-items:center;padding:12% 11%;cursor:grab;transition:transform .45s ease,opacity .45s}
.note.drag{transition:none;cursor:grabbing}
.txt{font:600 clamp(19px,5.4vw,28px)/1.55 var(--script);color:var(--ink);text-align:center;min-height:1.5em}
.txt.typing::after{content:'';display:inline-block;width:2px;height:1em;background:var(--ink);margin-left:2px;vertical-align:-2px;animation:blink .7s infinite}
@keyframes blink{50%{opacity:0}}
.cnt{position:absolute;right:14px;bottom:10px;font-size:11px;color:#bba;font-weight:700}
.stk{position:absolute;left:12px;bottom:8px;width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.floats{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pol{position:absolute;width:clamp(58px,15vw,92px);padding:4px 4px 12px;background:#fff;border-radius:3px;box-shadow:0 6px 16px rgba(90,30,70,.3);top:100%;animation:fl 10s linear forwards}
.pol div{aspect-ratio:1;background:center/cover}
@keyframes fl{0%{transform:translateY(0) rotate(var(--r))}100%{transform:translateY(-135vh) rotate(calc(var(--r) * -1))}}
@media (prefers-reduced-motion:reduce){.pol,.eseal,.heartbg span{animation:none}.txt.typing::after{animation:none}}
</style>
</head>
<body>
<div class="bg2"></div>
<div class="heartbg" id="hearts"></div>

<!-- 1. Khóa -->
<div class="scene on" id="lock">
  <div class="lockcard" id="card">
    <div class="lockphoto" id="lockPhoto"></div>
    <div class="pad">
      <div class="lh">♥</div>
      <h2>Nhập mật khẩu</h2>
      <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
      <div class="keys" id="keys"></div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</div>

<!-- 2. Phong thư -->
<div class="scene" id="envScene">
  <div class="env" id="env">
    <div class="eback"></div>
    <div class="eletter" id="eletter"></div>
    <div class="eflap"></div>
    <div class="efront"></div>
    <div class="eseal">♥</div>
  </div>
  <div class="hint" id="envHint">Chạm để mở 💗</div>
</div>

<!-- 3. Thư -->
<div class="scene" id="notes">
  <div class="floats" id="floats"></div>
  <div class="stack" id="stack">
    <div class="sheet s1" id="s1"></div>
    <div class="sheet s2" id="s2"></div>
    <div class="note" id="note">
      <div class="txt" id="txt"></div>
      <div class="stk" id="stk"></div>
      <div class="cnt" id="cnt"></div>
    </div>
  </div>
  <div class="hint" id="noteHint"></div>
</div>

<audio id="bgm" loop></audio>

<script>
/* =====================================================
   ✏️ CHỈNH SỬA Ở ĐÂY (chỉ cần sửa phần CONFIG này)
   ===================================================== */
const CONFIG = {
  pin: "2010",                       // Mật khẩu 4 số (20/10)
  pinHint: "Gợi ý: ngày hôm nay 💗", // Hiện ra khi nhập sai
  lockPhoto: "",                     // Ảnh ở màn hình khóa, vd "anh-khoa.jpg" (để trống = ảnh mẫu)
  photos: [],                        // Ảnh bay, vd ["a1.jpg","a2.jpg","a3.jpg"] (để trống = ảnh mẫu)
  music: "",                         // Nhạc nền, vd "nhac.mp3" (để trống = không phát)
  firstLine: "Gửi em...",            // Chữ hiện trên phong thư
  stickers: ["🧸","💌","🌸","🐻","🎀","🧋"],
  letters: [
    "Gửi em – người con gái anh thương! 💗",
    "Hôm nay là 20/10, ngày dành cho những cô gái đáng yêu nhất.",
    "Nhưng với anh, ngày nào em cũng xứng đáng được tặng hoa.",
    "Cảm ơn em vì đã kiên nhẫn với anh, cả những lúc anh vụng về.",
    "Có em, những ngày bình thường bỗng trở nên đáng nhớ.",
    "Anh thích nhất lúc em cười, mọi mệt mỏi đều tan biến.",
    "Mong em luôn khỏe, luôn vui và luôn làm điều em thích.",
    "Nếu có lúc em mệt, hãy nhớ phía sau em luôn có anh.",
    "Chúc em 20/10 thật ngọt ngào, như ly trà sữa em hay uống nhé 🧋",
    "Anh yêu em nhiều lắm! 😘💗"
  ]
};
/* ===================================================== */

const $ = id => document.getElementById(id);
const L = CONFIG.letters, N = L.length;
const small = () => innerWidth < 600;
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

// Ảnh mẫu (SVG) khi chưa có ảnh thật
const tones = [['#ffd1e3','#f58db6'],['#ffe3d1','#f7a98f'],['#e7d4ff','#b58cf0'],['#d1ecff','#7fb8ee'],['#d8f5df','#86cf9c']];
function ph(i){
  const [a,b] = tones[i % tones.length];
  const s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="100" height="130" fill="url(#g)"/><text x="50" y="76" font-size="38" text-anchor="middle" fill="#fff">♥</text></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(s);
}
const photo = i => CONFIG.photos.length ? CONFIG.photos[i % CONFIG.photos.length] : ph(i);
$('lockPhoto').style.backgroundImage = `url("${CONFIG.lockPhoto || ph(0)}")`;
$('eletter').textContent = CONFIG.firstLine;

// Trái tim bay nền
function heart(){
  const h = document.createElement('span');
  h.textContent = '♥';
  h.style.left = Math.random()*100 + 'vw';
  h.style.fontSize = (10 + Math.random()*16) + 'px';
  h.style.animationDuration = (7 + Math.random()*6) + 's';
  $('hearts').appendChild(h);
  setTimeout(() => h.remove(), 13500);
}
if(!reduce) setInterval(heart, 1100);

/* ---------- 1. Khóa ---------- */
let code = '', tries = 0;
const keys = $('keys');
[1,2,3,4,5,6,7,8,9,0,'⌫'].forEach(k => {
  const b = document.createElement('button');
  b.textContent = k;
  if(k === 0) b.className = 'z';
  b.onclick = () => press(String(k));
  keys.appendChild(b);
});
function drawDots(){ [...$('dots').children].forEach((d,i) => d.classList.toggle('f', i < code.length)); }
function press(k){
  startMusic();
  if(k === '⌫') code = code.slice(0,-1);
  else if(code.length < 4) code += k;
  drawDots();
  if(code.length === 4){
    if(code === CONFIG.pin){
      $('msg').textContent = 'Đúng rồi 💗';
      setTimeout(() => show('envScene'), 600);
    }else{
      tries++;
      $('card').classList.add('shake');
      $('msg').textContent = tries >= 2 ? CONFIG.pinHint : 'Sai rồi, thử lại nhé';
      setTimeout(() => { $('card').classList.remove('shake'); code = ''; drawDots(); }, 450);
    }
  }
}
addEventListener('keydown', e => {
  if(!$('lock').classList.contains('on')) return;
  if(/^\d$/.test(e.key)) press(e.key);
  else if(e.key === 'Backspace') press('⌫');
});

function show(id){
  document.querySelectorAll('.scene').forEach(s => s.classList.toggle('on', s.id === id));
  document.body.classList.toggle('in-notes', id === 'notes');
}
function startMusic(){
  if(CONFIG.music && !$('bgm').src){ $('bgm').src = CONFIG.music; $('bgm').play().catch(()=>{}); }
}

/* ---------- 2. Phong thư ---------- */
let opening = false;
$('env').onclick = () => {
  if(opening) return;
  opening = true;
  $('env').classList.add('open');
  $('envHint').style.opacity = 0;
  setTimeout(() => $('env').classList.add('gone'), 1700);
  setTimeout(() => { show('notes'); startLetter(); }, 2200);
};

/* ---------- 3. Thư ---------- */
let idx = 0, typing = false, timer = null, floatTimer = null, locked = true;
const note = $('note'), txt = $('txt');

function layers(){
  const left = N - 1 - idx;
  $('s1').style.display = left >= 1 ? '' : 'none';
  $('s2').style.display = left >= 2 ? '' : 'none';
}
function startLetter(){
  idx = 0;
  note.style.transform = ''; note.style.opacity = 1;
  floatTimer = setInterval(floater, small() ? 1100 : 800);
  for(let k = 0; k < 4; k++) setTimeout(floater, k * 250);
  write();
}
function write(){
  layers();
  const chars = Array.from(L[idx]);
  let i = 0;
  typing = true; locked = true;
  txt.textContent = '';
  txt.classList.add('typing');
  $('stk').textContent = CONFIG.stickers[idx % CONFIG.stickers.length];
  $('cnt').textContent = (idx + 1) + ' / ' + N;
  $('noteHint').textContent = 'Đợi lời nhắn viết xong nhé…';
  clearInterval(timer);
  timer = setInterval(() => {
    txt.textContent += chars[i++] || '';
    if(i >= chars.length){
      clearInterval(timer);
      txt.classList.remove('typing');
      typing = false; locked = false;
      $('noteHint').textContent = idx === N - 1 ? 'Vuốt ngang để khép lại lá thư 💗' : 'Vuốt ngang để đọc tiếp';
    }
  }, reduce ? 5 : 55);
}
function next(dir){
  if(locked) return;
  locked = true;
  note.classList.remove('drag');
  note.style.transform = `translateX(${dir * 130}%) rotate(${dir * 16}deg)`;
  note.style.opacity = 0;
  setTimeout(() => {
    if(idx === N - 1){ closeLetter(); return; }
    idx++;
    note.style.transition = 'none';
    note.style.transform = 'translateY(14px)';
    void note.offsetWidth;
    note.style.transition = '';
    note.style.transform = '';
    note.style.opacity = 1;
    write();
  }, 450);
}
function closeLetter(){
  clearInterval(floatTimer);
  $('floats').replaceChildren();
  show('envScene');
  opening = false;
  const e = $('env');
  e.classList.remove('open','gone');
  $('envHint').style.opacity = 1;
  $('envHint').textContent = 'Chạm để mở lại 💗';
}

// Kéo / vuốt ngang
let sx = null, dx = 0;
note.addEventListener('pointerdown', e => {
  if(locked) return;
  sx = e.clientX; dx = 0;
  note.classList.add('drag');
  note.setPointerCapture(e.pointerId);
});
note.addEventListener('pointermove', e => {
  if(sx === null) return;
  dx = e.clientX - sx;
  note.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`;
});
const release = () => {
  if(sx === null) return;
  const d = dx; sx = null;
  note.classList.remove('drag');
  if(Math.abs(d) > 60) next(d > 0 ? 1 : -1);
  else note.style.transform = '';
};
note.addEventListener('pointerup', release);
note.addEventListener('pointercancel', release);
addEventListener('keydown', e => {
  if(!$('notes').classList.contains('on')) return;
  if(e.key === 'ArrowRight') next(1);
  if(e.key === 'ArrowLeft') next(-1);
});

// Ảnh polaroid bay ở hai bên
let pc = 0;
function floater(){
  const box = $('floats');
  if(box.children.length >= (small() ? 9 : 14)) return;
  const p = document.createElement('div');
  p.className = 'pol';
  p.innerHTML = '<div></div>';
  p.firstChild.style.backgroundImage = `url("${photo(pc++)}")`;
  // Xuất phát từ đáy màn hình, vị trí ngang ngẫu nhiên, bay lên trên
  p.style.left = (2 + Math.random()*88) + '%';
  p.style.animationDuration = (8 + Math.random()*5) + 's';
  p.style.setProperty('--r', (Math.random()*30 - 15) + 'deg');
  box.appendChild(p);
  setTimeout(() => p.remove(), 13500);
}
</script>
</body>
</html>
